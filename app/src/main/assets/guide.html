<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XGIMI RS30 Ultra — Guide des Menus</title>
<style>
  :root{
    --bg: #0d0a17;
    --bg2: #150f24;
    --panel: #1b1430;
    --panel2: #221a3a;
    --violet: #8b5cf6;
    --violet2: #c084fc;
    --pink: #e879c9;
    --text: #ece7f7;
    --dim: #a89cc4;
    --line: #362a54;
    --accent-on: #7ee8b8;
    --accent-off: #8c7fae;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(139,92,246,0.25), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(232,121,201,0.15), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  header{
    padding:34px 20px 20px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(139,92,246,0.08), transparent);
  }
  .eyebrow{
    letter-spacing:3px;
    font-size:11px;
    text-transform:uppercase;
    color:var(--violet2);
    font-weight:600;
  }
  h1{
    margin:8px 0 4px;
    font-size:clamp(24px,5vw,38px);
    font-weight:800;
    background:linear-gradient(90deg,#fff,#d9c8ff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    letter-spacing:-0.5px;
  }
  .subtitle{color:var(--dim); font-size:14px;}

  .search-wrap{
    max-width:720px;
    margin:24px auto 6px;
    padding:0 20px;
  }
  .search-box{
    position:relative;
    display:flex;
    align-items:center;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px 16px;
    box-shadow: 0 0 0 1px rgba(139,92,246,0.05), 0 8px 24px rgba(0,0,0,0.35);
    transition:border-color .2s;
  }
  .search-box:focus-within{
    border-color:var(--violet);
    box-shadow:0 0 0 3px rgba(139,92,246,0.25);
  }
  .search-box svg{flex-shrink:0; margin-right:10px;}
  .search-box input{
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-size:16px;
    width:100%;
    font-family:inherit;
  }
  .search-box input::placeholder{color:var(--dim);}
  .clear-btn{
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--dim);
    border-radius:8px;
    padding:4px 10px;
    cursor:pointer;
    font-size:13px;
    display:none;
  }
  .clear-btn.show{display:block;}
  .result-count{
    max-width:720px;
    margin:8px auto 0;
    padding:0 24px;
    font-size:12px;
    color:var(--dim);
    min-height:16px;
  }

  .tabs{
    max-width:1000px;
    margin:22px auto 0;
    padding:0 20px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
  }
  .tab{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--dim);
    padding:9px 16px;
    border-radius:12px;
    font-size:13px;
    cursor:pointer;
    font-weight:600;
    transition:all .15s;
    white-space:nowrap;
  }
  .tab:hover{border-color:var(--violet2); color:var(--text);}
  .tab.active{
    background:linear-gradient(135deg,var(--violet),#6633cc);
    color:#fff;
    border-color:transparent;
    box-shadow:0 4px 14px rgba(139,92,246,0.4);
  }

  main{
    max-width:1000px;
    margin:28px auto;
    padding:0 20px;
  }
  .section{display:none;}
  .section.active{display:block;}
  .section.search-mode{display:block !important;}

  .group{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    margin-bottom:20px;
    overflow:hidden;
  }
  .group-header{
    padding:14px 20px;
    background:linear-gradient(90deg, rgba(139,92,246,0.18), rgba(232,121,201,0.06));
    border-bottom:1px solid var(--line);
    font-weight:700;
    font-size:14.5px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .group-header .icon{font-size:18px;}
  .rows{padding:6px 0;}
  .row{
    display:grid;
    grid-template-columns:110px 1fr 1.3fr;
    gap:14px;
    padding:12px 20px;
    border-bottom:1px solid rgba(255,255,255,0.03);
    align-items:start;
  }
  .row:last-child{border-bottom:none;}
  .row:hover{background:rgba(139,92,246,0.06);}
  .cn{
    color:var(--violet2);
    font-weight:600;
    font-size:14px;
  }
  .fr{
    font-weight:700;
    font-size:14.5px;
    color:var(--text);
  }
  .fn{
    color:var(--dim);
    font-size:13.5px;
    line-height:1.5;
  }
  .val{
    display:inline-block;
    margin-top:4px;
    font-size:11.5px;
    padding:2px 9px;
    border-radius:20px;
    font-weight:700;
  }
  .val.on{background:rgba(126,232,184,0.15); color:var(--accent-on);}
  .val.off{background:rgba(140,127,174,0.15); color:var(--accent-off);}
  .val.neutral{background:rgba(139,92,246,0.15); color:var(--violet2);}

  .options{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:8px;
  }
  .opt-label{
    font-size:11px;
    color:var(--dim);
    text-transform:uppercase;
    letter-spacing:0.5px;
    width:100%;
    margin-bottom:2px;
  }
  .opt-chip{
    font-size:12px;
    padding:3px 10px;
    border-radius:8px;
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--text);
  }
  .opt-chip.selected{
    background:linear-gradient(135deg,var(--violet),#6633cc);
    border-color:transparent;
    color:#fff;
    font-weight:700;
  }

  mark{
    background:var(--pink);
    color:#1a0d24;
    padding:0 2px;
    border-radius:3px;
  }

  .tip{
    margin:14px 20px 18px;
    padding:12px 16px;
    border-radius:12px;
    font-size:13px;
    line-height:1.5;
  }
  .tip.green{background:rgba(126,232,184,0.08); border:1px solid rgba(126,232,184,0.25); color:#c9f5e3;}
  .tip.amber{background:rgba(245,197,66,0.08); border:1px solid rgba(245,197,66,0.25); color:#f5e2b8;}

  .no-results{
    text-align:center;
    color:var(--dim);
    padding:60px 20px;
    font-size:14px;
  }

  .hero-icons{
    display:flex;
    justify-content:center;
    gap:14px;
    margin:20px auto 0;
    flex-wrap:wrap;
    max-width:600px;
  }
  .hicon{
    width:44px;height:44px;
    border-radius:14px;
    background:linear-gradient(135deg,var(--panel2),var(--panel));
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:19px;
  }

  footer{
    text-align:center;
    color:var(--dim);
    font-size:12px;
    margin-top:40px;
    padding:0 20px;
  }

  @media (max-width:640px){
    .row{grid-template-columns:1fr; gap:4px;}
    .cn{font-size:12.5px;}
  }
</style>
</head>

// ---- Build tabs ----
const tabsEl = document.getElementById('tabs');
const mainEl = document.getElementById('main');

DATA.forEach((section, i) => {
  const tab = document.createElement('button');
  tab.className = 'tab' + (i===0 ? ' active' : '');
  tab.textContent = section.icon + ' ' + section.title;
  tab.dataset.target = section.id;
  tab.addEventListener('click', () => showSection(section.id));
  tabsEl.appendChild(tab);

  const sec = document.createElement('div');
  sec.className = 'section' + (i===0 ? ' active' : '');
  sec.id = 'sec-' + section.id;

  let html = '';
  section.groups.forEach(g => {
    html += `<div class="group" data-group>
      <div class="group-header"><span class="icon">${g.icon||''}</span>${g.name}</div>
      <div class="rows">`;
    g.rows.forEach(r => {
      const optSearch = (r.options||[]).map(o => o.cn+' '+o.fr+' '+(o.note||'')).join(' ');
      let optsHtml = '';
      if (r.options && r.options.length) {
        optsHtml = `<div class="options"><span class="opt-label">Choix disponibles</span>`;
        r.options.forEach(o => {
          optsHtml += `<span class="opt-chip${o.selected?' selected':''}" title="${o.fr}${o.note?' — '+o.note:''}">${o.cn} · ${o.fr}${o.selected?' ✓':''}</span>`;
        });
        optsHtml += `</div>`;
      }
      html += `<div class="row" data-row data-search="${(r.cn+' '+r.fr+' '+r.fn+' '+(r.val||'')+' '+optSearch).toLowerCase()}">
        <div class="cn">${r.cn}</div>
        <div class="fr">${r.fr}</div>
        <div class="fn">${r.fn}${r.val ? `<br><span class="val ${r.valType||'neutral'}">${r.val}</span>` : ''}${optsHtml}</div>
      </div>`;
    });
    html += `</div></div>`;
  });
  if (section.tip) {
    html += `<div class="tip ${section.tip.type}">${section.tip.text}</div>`;
  }
  sec.innerHTML = html;
  mainEl.appendChild(sec);
});

function showSection(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.target === id));
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === 'sec-' + id));
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').classList.remove('show');
  document.getElementById('resultCount').textContent = '';
  document.querySelectorAll('.section').forEach(s => s.classList.remove('search-mode'));
  document.querySelectorAll('[data-row]').forEach(r => r.style.display = '');
  document.querySelectorAll('[data-group]').forEach(g => g.style.display = '');
}

// ---- Search ----
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const resultCount = document.getElementById('resultCount');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  clearBtn.classList.toggle('show', q.length > 0);

  if (!q) {
    const activeTab = document.querySelector('.tab.active');
    showSection(activeTab ? activeTab.dataset.target : DATA[0].id);
    return;
  }

  let total = 0;
  document.querySelectorAll('.section').forEach(s => s.classList.add('search-mode'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

  document.querySelectorAll('[data-group]').forEach(group => {
    let groupHasMatch = false;
    group.querySelectorAll('[data-row]').forEach(row => {
      const match = row.dataset.search.includes(q);
      row.style.display = match ? '' : 'none';
      if (match) { groupHasMatch = true; total++; }
    });
    group.style.display = groupHasMatch ? '' : 'none';
  });

  resultCount.textContent = total === 0
    ? `Aucun résultat pour « ${searchInput.value} »`
    : `${total} résultat${total>1?'s':''} pour « ${searchInput.value} »`;
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchInput.dispatchEvent(new Event('input'));
  searchInput.focus();
});

document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  }
});
</script>
